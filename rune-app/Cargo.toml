[package]
name = "sone-rune"
version = "0.23.0"
edition = "2024"
license = "GPL-3.0-only"
description = "SONE with a native Rune UI over the unchanged SONE backend (no WebKitGTK)."
publish = false

[[bin]]
name = "sone-rune"
path = "src/main.rs"

[dependencies]
# The SONE backend, built without Tauri/WebKit; `tauri::` resolves to host-shim.
sone = { path = "../src-tauri", default-features = false, features = ["host"] }
sone-host-shim = { path = "../src-tauri/host-shim" }
rune = { git = "https://github.com/anomalyco/rune", rev = "6c3cb8abf150e1c43b2f276a14568b2f2f504d72", features = ["accessibility", "native-file-dialog"] }
# Search folding for the filters (rune_kit::search): case, accents and widths as a reader expects.
rune-kit = { git = "https://github.com/anomalyco/rune", rev = "6c3cb8abf150e1c43b2f276a14568b2f2f504d72" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time", "macros", "net", "io-util", "signal"] }
log = "0.4"
# cover art: decode and resize to the drawn size (already in the build via the backend)
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
rand = "0.8"
# music videos (video.rs): the same GStreamer the backend plays audio with
gstreamer = "0.23"
gstreamer-app = "0.23"
gstreamer-video = "0.23"

# Rune patches these crates in its own workspace, and a dependency's [patch] doesn't reach ours,
# so an app that builds Rune patches them too, from the same rev (Rune's README, "Depending on
# Rune"). Keep the list equal to the [patch.crates-io] table in Rune's root Cargo.toml.
[patch.crates-io]
winit = { git = "https://github.com/anomalyco/rune", rev = "6c3cb8abf150e1c43b2f276a14568b2f2f504d72" }
parley_engine = { git = "https://github.com/anomalyco/rune", rev = "6c3cb8abf150e1c43b2f276a14568b2f2f504d72" }
wgpu-hal = { git = "https://github.com/anomalyco/rune", rev = "6c3cb8abf150e1c43b2f276a14568b2f2f504d72" }
accesskit_windows = { git = "https://github.com/anomalyco/rune", rev = "6c3cb8abf150e1c43b2f276a14568b2f2f504d72" }

[profile.dev]
opt-level = 1
[profile.dev.package."*"]
opt-level = 3
