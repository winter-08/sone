[package]
name = "sone-rune"
version = "0.23.0"
edition = "2024"
license = "GPL-3.0-only"
description = "SONE with a native Rune UI over the unchanged SONE backend (no WebKitGTK)."
publish = false

[[bin]]
name = "sone-rune"
path = "src/main.rs"

[dependencies]
# The SONE backend, built without Tauri/WebKit; `tauri::` resolves to host-shim.
sone = { path = "../src-tauri", default-features = false, features = ["host"] }
sone-host-shim = { path = "../src-tauri/host-shim" }
rune = { git = "https://github.com/anomalyco/rune", rev = "58eeef5f8974299aa5e471de0010123323e3127e", features = ["accessibility"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time", "macros", "net", "io-util"] }
log = "0.4"
# cover art: decode and resize to the drawn size (already in the build via the backend)
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
rand = "0.8"
# music videos (video.rs): the same GStreamer the backend plays audio with
gstreamer = "0.23"
gstreamer-app = "0.23"
gstreamer-video = "0.23"

[profile.dev]
opt-level = 1
[profile.dev.package."*"]
opt-level = 3
