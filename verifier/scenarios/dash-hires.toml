name = "dash-hires"
description = "A DASH hi-res stream (96 kHz/24-bit FLAC in fMP4) plays bit-perfect to the end."
covers = ["stream:dash", "settings:exclusive_mode", "settings:bit_perfect"]
tracks = [1004]

[[step]]
mcp = { tool = "play_tracks", args = { track_ids = [1004], action = "play_now" } }
[[step]]
wait_for = { "mpris.status" = "Playing", timeout = 10 }
[[step]]
label = "end"
wait_for = { "mpris.status" = "Paused", timeout = 15 }
