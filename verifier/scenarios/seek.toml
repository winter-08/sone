name = "seek"
description = "seek_to jumps output to the requested frame."
covers = ["mcp_tools:seek_to"]
tracks = [1001]
quarantine = "exclusive-mode seek stalls nondeterministically in the sandbox (app writer or pipewire-alsa slave: confirm on real hardware); seek-shared covers seek meanwhile"

[[step]]
mcp = { tool = "play_tracks", args = { track_ids = [1001], action = "play_now" } }
[[step]]
wait_for = { "mpris.status" = "Playing", timeout = 10 }
[[step]]
wait = 1.0
[[step]]
label = "seek to 6s"
mcp = { tool = "seek_to", args = { position_seconds = 6 } }
[[step]]
label = "end"
wait_for = { "mpris.status" = "Paused", timeout = 15 }
