name = "queue-ops"
description = "Queue editing while playing: append, play-next, remove, clear."
covers = ["mcp_tools:play_tracks", "mcp_tools:remove_from_queue", "mcp_tools:clear_queue", "mcp_tools:get_queue"]
audio = false

[[step]]
mcp = { tool = "play_tracks", args = { track_ids = [1001], action = "play_now" } }
[[step]]
label = "append B"
mcp = { tool = "play_tracks", args = { track_ids = [1006], action = "queue" } }
[[step]]
label = "play C next"
mcp = { tool = "play_tracks", args = { track_ids = [1007], action = "play_next" } }
[[step]]
label = "append A, B again"
mcp = { tool = "play_tracks", args = { track_ids = [1005, 1006], action = "queue" } }
[[step]]
label = "remove B"
mcp = { tool = "remove_from_queue", args = { track_id = 1006 } }
[[step]]
label = "clear"
mcp = { tool = "clear_queue" }
[[step]]
label = "pause"
mcp = { tool = "pause" }
