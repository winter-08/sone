name = "tray-control"
description = "Tray menu actions drive playback."
covers = ["events:tray:next-track", "events:tray:prev-track", "events:tray:toggle-play"]
tracks = [1005, 1006]

[[step]]
mcp = { tool = "play_tracks", args = { track_ids = [1005, 1006], action = "play_now" } }
[[step]]
wait_for = { "mpris.status" = "Playing", timeout = 10 }
[[step]]
label = "tray next"
tray = "Next Track"
[[step]]
label = "tray previous"
tray = "Previous Track"
[[step]]
label = "tray play/pause"
tray = "Play / Pause"
[[step]]
wait = 1.0
