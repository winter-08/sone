name = "pause-resume-shared"
description = "Pause/resume in shared (PipeWire) output mode."
covers = ["mcp_tools:pause", "mcp_tools:resume"]
tracks = [1005]
audio = false
profile = { exclusive_mode = false, bit_perfect = false }

[[step]]
mcp = { tool = "play_tracks", args = { track_ids = [1005], action = "play_now" } }
[[step]]
wait_for = { "mpris.status" = "Playing", timeout = 10 }
[[step]]
wait = 1.5
[[step]]
label = "pause"
mcp = { tool = "pause" }
[[step]]
label = "still paused"
wait = 2.0
[[step]]
label = "resume"
mcp = { tool = "resume" }
[[step]]
label = "end"
wait_for = { "mpris.status" = "Paused", timeout = 15 }
