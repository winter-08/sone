name = "play-single"
description = "Play one track to the end: state while playing, then what end-of-queue looks like."
covers = ["mcp_tools:play_tracks", "mcp_tools:get_now_playing", "mcp_tools:get_queue"]
tracks = [1005]

[[step]]
label = "play one track"
mcp = { tool = "play_tracks", args = { track_ids = [1005], action = "play_now" } }

[[step]]
label = "playing"
wait_for = { "mpris.status" = "Playing", timeout = 10 }

[[step]]
label = "mid-track"
wait = 2.0

[[step]]
label = "ended"
wait_for = { "mpris.status" = "Paused", timeout = 15 }
