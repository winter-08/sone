name = "repeat-one"
description = "Repeat one replays the same track instead of advancing."
covers = ["mcp_tools:set_repeat"]
tracks = [1005, 1006]
quarantine = "exclusive-mode repeat replay is nondeterministic in the reference itself (recording 2026-11-08: one run stalls at 0, two play on); repeat-one-shared covers the logic"

[[step]]
label = "repeat one"
mcp = { tool = "set_repeat", args = { mode = "one" } }
[[step]]
mcp = { tool = "play_tracks", args = { track_ids = [1005, 1006], action = "play_now" } }
[[step]]
wait_for = { "mpris.status" = "Playing", timeout = 10 }
[[step]]
label = "past the first loop"
wait = 10.0
[[step]]
label = "repeat off"
mcp = { tool = "set_repeat", args = { mode = "off" } }
[[step]]
mcp = { tool = "pause" }
