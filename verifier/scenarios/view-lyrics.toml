name = "view-lyrics"
description = "The lyrics panel for a track with synced lyrics, then for one without."
covers = ["views:lyrics"]
views = true
audio = false

[[step]]
mcp = { tool = "play_tracks", args = { track_ids = [1001, 1002], action = "play_now" } }
[[step]]
wait_for = { "mpris.status" = "Playing", timeout = 10 }
[[step]]
label = "open lyrics"
ui = { press = "Lyrics" }
settle = 2.0
[[step]]
label = "track without lyrics"
mcp = { tool = "skip_next" }
settle = 2.5
[[step]]
mcp = { tool = "pause" }
