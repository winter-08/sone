name = "repeat-all"
description = "Repeat all wraps from the last track back to the first."
covers = ["mcp_tools:set_repeat"]
tracks = [1005, 1006]

[[step]]
label = "repeat all"
mcp = { tool = "set_repeat", args = { mode = "all" } }
[[step]]
mcp = { tool = "play_tracks", args = { track_ids = [1005, 1006], action = "play_now" } }
[[step]]
wait_for = { "mpris.track.title" = "Queue B", timeout = 15 }
[[step]]
label = "wrapped to A"
wait_for = { "mpris.track.title" = "Queue A", timeout = 15 }
[[step]]
mcp = { tool = "set_repeat", args = { mode = "off" } }
[[step]]
mcp = { tool = "pause" }
