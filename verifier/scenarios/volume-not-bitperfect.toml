name = "volume-not-bitperfect"
description = "With bit-perfect off, volume 0.5 scales samples: output must NOT match the fixture."
covers = ["mcp_tools:set_volume", "settings:bit_perfect"]
tracks = [1005]
profile = { bit_perfect = false }

[[step]]
label = "volume 0.5"
mcp = { tool = "set_volume", args = { level = 0.5 } }
[[step]]
mcp = { tool = "play_tracks", args = { track_ids = [1005], action = "play_now" } }
[[step]]
label = "end"
wait_for = { "mpris.status" = "Paused", timeout = 15 }
