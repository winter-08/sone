name = "view-drawer-tabs"
description = "The now-playing drawer's Suggested tracks (track radio) and Credits tabs."
covers = ["views:drawer:suggested", "views:drawer:credits"]
views = true
audio = false

[[step]]
mcp = { tool = "play_tracks", args = { track_ids = [1001, 1002], action = "play_now" } }
[[step]]
wait_for = { "mpris.status" = "Playing", timeout = 10 }
[[step]]
label = "pause (keeps the same track current for the rest)"
mcp = { tool = "pause" }
[[step]]
label = "open drawer"
ui = { press = "Play queue" }
settle = 1.5
[[step]]
label = "suggested tracks"
ui = { press = "Suggested tracks" }
settle = 2.0
[[step]]
label = "credits"
ui = { press = "Credits" }
settle = 2.0
