name = "rate-switch"
description = "Exclusive output follows the source rate across a 44.1 kHz -> 96 kHz -> 192 kHz queue."
covers = ["settings:exclusive_mode", "events:signal-path-changed"]
tracks = [1001, 1002, 1003]

[[step]]
mcp = { tool = "play_tracks", args = { track_ids = [1001, 1002, 1003], action = "play_now" } }
[[step]]
wait_for = { "mpris.track.title" = "Fixture 1002", timeout = 15 }
[[step]]
wait_for = { "mpris.track.title" = "Fixture 1003", timeout = 15 }
[[step]]
label = "end"
wait_for = { "mpris.status" = "Paused", timeout = 15 }
