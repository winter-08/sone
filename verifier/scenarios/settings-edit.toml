name = "settings-edit"
description = "Editing settings text fields: Discord status, ListenBrainz token, overlay host, proxy username (all persisted)."
covers = ["settings:discord_status_text", "settings:scrobble.listenbrainz", "settings:overlay_host", "settings:proxy.username"]
views = true
audio = false
settings = ["discord_status_text", "scrobble", "overlay_host", "proxy"]

[[step]]
ui = { press = "Account" }
settle = 1.0
[[step]]
ui = { press = "Settings" }
settle = 1.5
[[step]]
label = "discord tab"
ui = { press = "Discord" }
settle = 1.0
[[step]]
label = "edit status text"
ui = { type = "{artist} - {track}", into = "{track} by {artist} on {album}", role = "entry" }
settle = 2.5
[[step]]
label = "scrobbling tab"
ui = { press = "Scrobbling" }
settle = 1.0
[[step]]
label = "listenbrainz token"
ui = { type = "fixture-token", into = "User token", role = "entry" }
settle = 1.0
[[step]]
label = "connect"
ui = { press = "Connect", nth = 2 }
settle = 2.5
[[step]]
label = "overlay tab"
ui = { press = "OBS Overlay" }
settle = 1.0
[[step]]
label = "replace host"
ui = { type = "127.0.0.2", into = "127.0.0.1", role = "entry", select_all = true }
settle = 0.5
[[step]]
label = "apply host"
ui = { press = "Apply", nth = 0 }
settle = 2.0
[[step]]
label = "network tab"
ui = { press = "Network" }
settle = 1.0
[[step]]
label = "proxy username"
ui = { type = "verifier", into = "Username", role = "entry" }
settle = 2.5
