name = "skip-next"
description = "skip_next twice mid-track: partial plays, then the last track to the end."
covers = ["mcp_tools:skip_next"]
tracks = [1005, 1006, 1007]

[[step]]
mcp = { tool = "play_tracks", args = { track_ids = [1005, 1006, 1007], action = "play_now" } }
[[step]]
wait_for = { "mpris.status" = "Playing", timeout = 10 }
[[step]]
wait = 1.5
[[step]]
label = "skip to B"
mcp = { tool = "skip_next" }
[[step]]
wait = 1.0
[[step]]
label = "skip to C"
mcp = { tool = "skip_next" }
[[step]]
label = "end of queue"
wait_for = { "mpris.status" = "Paused", timeout = 15 }
