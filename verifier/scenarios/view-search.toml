name = "view-search"
description = "Search: suggestions dropdown, the results page, and every results tab."
covers = ["views:search"]
views = true
audio = false

[[step]]
label = "type a query"
ui = { type = "fixture", into = "Search", role = "entry" }
settle = 2.0
[[step]]
label = "all results"
ui = { press = "View all results" }
settle = 2.0
[[step]]
label = "tracks tab"
ui = { press = "Tracks", nth = 0 }
settle = 1.5
[[step]]
label = "albums tab"
ui = { press = "Albums", nth = 1 }
settle = 1.5
[[step]]
label = "artists tab"
ui = { press = "Artists", nth = 1 }
settle = 1.5
[[step]]
label = "playlists tab"
ui = { press = "Playlists", nth = 1 }
settle = 1.5
[[step]]
label = "back to all"
ui = { press = "All Results" }
settle = 1.5
