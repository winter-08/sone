# Written-down, intentional differences between the candidate (Rune) and the reference (React).
# Each entry needs a reason. The comparator and scorer apply these; `check` and `score` say so.

[extra_controls]
# Controls the candidate exposes with a name where the reference's are unnamed or absent.
reason = "The reference's player-bar transport and sliders have no accessible names (an accessibility defect); the candidate names them. The queue panel heading is the candidate's queue view."
allow = [
  "button: Play", "button: Pause", "button: Previous", "button: Next", "button: Shuffle",
  "button: Repeat", "button: Repeat all", "button: Repeat one",
  "toggle button: Shuffle", "toggle button: Repeat", "toggle button: Repeat all", "toggle button: Repeat one",
  "slider: Position", "slider: Volume",
  # the Shortcuts/About dialogs' close button is unnamed in the reference
  "button: Close dialog",
  # the album header's artist: a clickable span in the reference (TrackArtists), not exposed;
  # the candidate makes it a keyboard-reachable link to the artist's page
  "link: Fixture Artist",
]

[modal_overlays]
# The candidate's account menu, Settings and dialogs are modal: the page behind them is inert
# (no hover or clicks reach it, and a press outside closes them), and Rune takes inert content
# out of the accessibility tree, as aria-modal dialogs hide the page from screen readers. The
# reference keeps the page in its DOM under its menus. While one of these controls (which only
# exist with that overlay open) is in a snapshot, controls missing from it are waived; extras
# and the overlay's own contents are still compared.
reason = "Modal overlays make the page behind them inert, which removes it from the accessibility tree."
markers = [
  "button: Log out",       # the account menu
  "button: Discord",       # a Settings tab
  "button: Close dialog",  # the Shortcuts and About dialogs
]
