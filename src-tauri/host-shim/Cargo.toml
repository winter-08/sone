[package]
name = "sone-host-shim"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
description = "The slice of Tauri's API that SONE's backend uses, without a webview: lets the backend run under a native (Rune) UI."

[dependencies]
sone-host-shim-macros = { path = "macros" }
serde = "1"
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync"] }
url = "2"
thiserror = "2"
